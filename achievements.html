<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Achievements | HabitFlow</title>

    <!-- Base -->
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/root.css">

    <!-- Global -->
    <link rel="stylesheet" href="css/global.css">

    <!-- Navigation -->
    <link rel="stylesheet" href="css/components/navigation.css">

    <!-- Page -->
    <link rel="stylesheet" href="css/pages/achievements/main.css">
    <link rel="stylesheet" href="css/pages/achievements/summary.css">
    <link rel="stylesheet" href="css/pages/achievements/filters.css">
    <link rel="stylesheet" href="css/pages/achievements/cards.css">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>


<body>

    <!-- =========================================================
         ACHIEVEMENTS PAGE
    ========================================================== -->

    <main class="achievements-page">

        <!-- =========================================================
         ACHIEVEMENTS HEADER
    ========================================================== -->

        <section class="achievements-header">

            <div class="achievements-header-content">

                <div class="achievements-title-icon">
                    <span class="material-symbols-rounded">
                        emoji_events
                    </span>
                </div>

                <div class="achievements-title-text">

                    <h1>Achievements</h1>

                    <p>
                        Celebrate your progress and every milestone along the way.
                    </p>

                </div>

            </div>


            <!-- Streaksaur -->
            <div class="achievements-header-avatar">

                <img src="img/streakasaur-hero.png" alt="Streaksaur">

            </div>

        </section>

        <!-- =========================================================
         ACHIEVEMENT SUMMARY
    ========================================================== -->

        <section class="achievement-summary">

            <!-- Unlocked -->
            <div class="achievement-summary-item">

                <div class="summary-icon summary-unlocked">
                    <span class="material-symbols-rounded">
                        workspace_premium
                    </span>
                </div>

                <div class="summary-info">
                    <strong id="summary-unlocked">0</strong>
                    <span>Unlocked</span>
                </div>

            </div>


            <div class="summary-divider"></div>


            <!-- Locked -->
            <div class="achievement-summary-item">

                <div class="summary-icon summary-locked">
                    <span class="material-symbols-rounded">
                        lock
                    </span>
                </div>

                <div class="summary-info">
                    <strong id="summary-locked">0</strong>
                    <span>Locked</span>
                </div>

            </div>


            <div class="summary-divider"></div>


            <!-- Points -->
            <div class="achievement-summary-item">

                <div class="summary-icon summary-points">
                    <span class="material-symbols-rounded">
                        diamond
                    </span>
                </div>

                <div class="summary-info">
                    <strong id="summary-points">0</strong>
                    <span>Points</span>
                </div>

            </div>


            <div class="summary-divider"></div>


            <!-- Best Streak -->
            <div class="achievement-summary-item">

                <div class="summary-icon summary-streak">
                    <span class="material-symbols-rounded">
                        local_fire_department
                    </span>
                </div>

                <div class="summary-info">
                    <strong id="summary-best-streak">0</strong>
                    <span>Best Streak</span>
                </div>

            </div>

        </section>

        <!-- =========================================================
         ACHIEVEMENT COLLECTION
    ========================================================== -->

        <section class="achievement-collection">
            <!-- =====================================================
             ACHIEVEMENT FILTERS
            ====================================================== -->

            <div class="achievement-filters">

                <button type="button" class="achievement-filter active" data-category="all">
                    All
                </button>

                <button type="button" class="achievement-filter" data-category="streak">
                    <span class="material-symbols-rounded">
                        local_fire_department
                    </span>

                    Streaks
                </button>

                <button type="button" class="achievement-filter" data-category="habit">
                    <span class="material-symbols-rounded">
                        checklist
                    </span>

                    Habits
                </button>

                <button type="button" class="achievement-filter" data-category="milestone">
                    <span class="material-symbols-rounded">
                        workspace_premium
                    </span>

                    Milestones
                </button>

                <div class="achievement-progress">
                    <span id="achievement-progress-count">0 / 0</span>
                    <small>unlocked</small>
                </div>

            </div>

            <!-- =====================================================
             ACHIEVEMENT GRID
        ====================================================== -->
            <!-- =====================================================
     STREAK ACHIEVEMENTS
====================================================== -->

            <div class="achievement-category-section">

                <div class="achievement-category-header">
                    <h3>
                        <span class="material-symbols-rounded">
                            local_fire_department
                        </span>

                        Streaks
                    </h3>
                </div>

                <div id="streak-achievement-grid" class="achievement-grid"></div>

            </div>


            <!-- =====================================================
     HABIT ACHIEVEMENTS
====================================================== -->

            <div class="achievement-category-section">

                <div class="achievement-category-header">
                    <h3>
                        <span class="material-symbols-rounded">
                            checklist
                        </span>

                        Habits
                    </h3>
                </div>

                <div id="habit-achievement-grid" class="achievement-grid"></div>

            </div>


            <!-- =====================================================
     MILESTONE ACHIEVEMENTS
====================================================== -->

            <div class="achievement-category-section">

                <div class="achievement-category-header">
                    <h3>
                        <span class="material-symbols-rounded">
                            workspace_premium
                        </span>

                        Milestones
                    </h3>
                </div>

                <div id="milestone-achievement-grid" class="achievement-grid"></div>

            </div>



        </section>

    </main>


    <!-- =========================================================
         CORE
    ========================================================== -->

    <script src="js/core/storage.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/protect.js"></script>


    <!-- =========================================================
         SHARED
    ========================================================== -->

    <script src="js/shared/profile-utils.js"></script>
    <script src="js/shared/navigation.js"></script>
    <script src="js/shared/habit-utils.js"></script>


    <script src="js/achievements/data.js"></script>
    <script src="js/achievements/evaluator.js"></script>
    <script src="js/achievements/render.js"></script>
    <script src="js/achievements/main.js"></script>

</body>

</html>
